<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hifz Tracker</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script src="common.js"></script>
<script src="plus.js"></script>
<script>
const reportFlow = () => numberSheet({ title: "📖 Necha sahifa yodladingiz?", nums: [0.5, 1, 1.5, 2, 3, 4, 5],
  hint: "Yo'naltiruvchiga yuboriladi, u tekshirib tasdiqlaydi.",
  onPick: v => act("report", { pages: v }, "📨 Yuborildi, yo'naltiruvchi tekshiradi") });

async function homeView() {
  const my = S.me.my, root = h("div");
  root.append(h("div", { class: "actions" },
    h("button", { class: "btn primary", onclick: reportFlow }, "📖 Yodladim")));

  const card = h("div", { class: "card" },
    h("div", { class: "row" }, h("b", {}, "Haftalik maqsad"), h("span", { class: "num" }, my.goal ? fmt(my.approved) + " / " + fmt(my.goal) : "reja yo'q")));
  if (my.goal) {
    const left = Math.max(0, my.goal - my.approved - my.pending);
    const behind = my.approved + my.pending + 1e-9 < my.expected;
    card.append(bar(my.approved, my.pending, my.goal, my.expected),
      h("div", { class: "meta" },
        h("span", { class: behind ? "warn" : "ok" }, behind ? "⚠️ Rejadan orqada" : "👍 Reja bo'yicha"),
        h("span", {}, "Qoldi: " + fmt(left)),
        my.pending ? h("span", {}, "⏳ Tekshirilmoqda: " + fmt(my.pending)) : null));
    if (my.approved + 1e-9 >= my.goal) card.append(h("div", { class: "banner" }, "🎉 Haftalik maqsad bajarildi! 🏖️ Qolgan kunlar izin"));
  } else card.append(h("div", { class: "meta" }, "Maqsadni yo'naltiruvchi belgilaydi"));
  root.append(card);

  ltInfo(my.lt).forEach(([t, v, d, g]) => root.append(h("div", { class: "card" },
    h("div", { class: "row" }, h("b", {}, t), h("span", { class: "num" }, g ? Math.round(d / g * 100) + "%" : "")),
    bar(d, 0, g), h("div", { class: "meta" }, v))));
  if (my.lt.suggest) root.append(h("div", { class: "tip" }, "💡 Tavsiya etilgan haftalik: " + fmt(my.lt.suggest) + " sahifa"));

  root.append(h("div", { class: "card" },
    h("div", { class: "row" }, h("span", {}, "🏅 Hamma vaqt"), h("b", {}, fmt(my.allTime) + " sahifa")),
    h("div", { class: "row" }, h("span", {}, "🏆 Bajarilgan haftalar"), h("b", {}, String(my.rec.total))),
    h("div", { class: "row" }, h("span", {}, "🔥 Hafta seriyasi"), h("b", {}, String(my.rec.streak)))));
  return root;
}

const VIEWS = { home: homeView, plan: planView, live: liveView, rank: rankView };
let R = 0;
async function render() {
  const my = ++R;
  const nav = h("nav", { class: "nav" }, [["home", "📊", "Natijam"], ["plan", "🗺", "Reja"], ["live", "🔴", "Hozir"], ["rank", "🏆", "Reyting"]].map(([id, ic, lb]) =>
    h("button", { class: id === S.tab ? "on" : "", onclick: () => { S.tab = id; render(); } }, h("span", { class: "ic" }, ic), h("span", {}, lb))));
  const body = h("div", {}, h("div", { class: "msg" }, "Yuklanmoqda…"));
  $app.replaceChildren(
    h("div", { class: "top" }, h("div", {}, h("h1", {}, "🌙 Hifz Tracker"), h("div", { class: "sub" }, S.me.name)),
      S.me.isAdmin ? h("a", { class: "pill", href: "admin/" }, "👑 Panel") : null),
    body, nav);
  try {
    const view = await VIEWS[S.tab]();
    if (my === R) body.replaceChildren(view);
  } catch (e) { if (my === R) body.replaceChildren(h("div", { class: "msg" }, "Yuklanmadi: " + e.message)); }
}

(async function boot() {
  if (!tg || !tg.initData) return showMsg("Bu sahifa Telegram ichida ochiladi.<br>Botda <b>🌐 Sayt</b> tugmasini bosing.");
  try { S.me = await rpc("me"); }
  catch (e) {
    return showMsg(e.message === "auth" ? "Sessiya eskirgan. Saytni Telegramdan qayta oching."
      : e.message === "no_circle" ? "Siz hali halqaga qo'shilmagansiz.<br>Yo'naltiruvchidan taklif havolasini so'rang."
      : "Yuklanmadi. Birozdan keyin qayta urinib ko'ring.");
  }
  if (S.me.isAdmin && !S.me.isMember) { location.replace("admin/"); return; }
  S.tab = "home";
  render();
})();
</script>
</body>
</html>
