<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hifz Tracker</title>
<style>
  :root {
    --bg: #f6f4ee; --card: #ffffff; --ink: #1d2b24; --muted: #6b7a72;
    --green: #1f7a54; --green-soft: #dff1e8; --gold: #c8932b; --line: #e4e0d4; --empty: #e9e6db;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111a16; --card: #19251f; --ink: #eaf1ec; --muted: #8fa398;
      --green: #3fc48a; --green-soft: #1f3a2d; --gold: #e0b052; --line: #263a30; --empty: #263a30; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 22px; margin: 4px 0 2px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; text-align: center; }
  .stat b { display: block; font-size: 24px; color: var(--green); }
  .stat span { font-size: 12px; color: var(--muted); }
  .m { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  .top { display: flex; align-items: center; gap: 10px; }
  .name { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .num { font-weight: 700; color: var(--green); white-space: nowrap; }
  .bar { position: relative; height: 12px; background: var(--empty); border-radius: 99px; overflow: hidden; margin: 10px 0 6px; }
  .bar i { position: absolute; top: 0; left: 0; height: 100%; }
  .bar .p { background: var(--gold); }
  .bar .a { background: var(--green); }
  .bar .e { background: transparent; border-right: 2px solid var(--ink); opacity: .45; }
  .meta { font-size: 12px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
  .ok { color: var(--green); } .warn { color: var(--gold); }
  .msg { text-align: center; color: var(--muted); padding: 40px 10px; }
  code { background: var(--empty); padding: 1px 6px; border-radius: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🌙 Hifz Tracker</h1>
  <div class="sub" id="sub">Yuklanmoqda…</div>
  <div id="app"></div>
</div>

<script>
const API = "https://fsmfhyustigomtvtnevo.supabase.co/functions/v1/hifz-bot/api";
const code = new URLSearchParams(location.search).get("c");
const app = document.getElementById("app");
const sub = document.getElementById("sub");

function el(tag, cls, txt) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt !== undefined) e.textContent = txt;
  return e;
}
const fmt = n => String(Math.round(n * 100) / 100).replace(".5", "½").replace(/^0½$/, "½");

function message(html) {
  app.replaceChildren();
  const d = el("div", "msg");
  d.innerHTML = html;
  app.append(d);
}

async function load() {
  if (!code) {
    sub.textContent = "";
    return message("Havola to'liq emas.<br>Botda yo'naltiruvchi menyusidagi <code>🌐 Sayt</code> tugmasini bosing.");
  }
  try {
    const r = await fetch(API + "?c=" + encodeURIComponent(code));
    if (r.status === 404) return message("Halqa topilmadi. Botdan yangi havola oling.");
    if (!r.ok) throw new Error();
    render(await r.json());
  } catch (e) {
    message("Ma'lumot yuklanmadi. Birozdan keyin qayta urinib ko'ring.");
  }
}

function render(d) {
  const ms = d.members;
  const withGoal = ms.filter(m => m.goal > 0).length;
  const approved = ms.reduce((s, m) => s + m.approved, 0);

  sub.textContent = "Hafta boshlanishi: " + d.week_start;
  app.replaceChildren();

  const stats = el("div", "stats");
  [[ms.length, "a'zo"], [withGoal + "/" + ms.length, "reja belgilangan"], [fmt(approved), "tasdiqlangan sahifa"]].forEach(([v, l]) => {
    const s = el("div", "stat"); s.append(el("b", "", v), el("span", "", l)); stats.append(s);
  });
  app.append(stats);

  if (!ms.length) return app.append(el("div", "msg", "Hali a'zolar yo'q."));

  ms.forEach(m => {
    const card = el("div", "m");
    const top = el("div", "top");
    top.append(el("div", "name", m.name),
      el("div", "num", m.goal ? fmt(m.approved) + " / " + fmt(m.goal) : "reja yo'q"));
    card.append(top);
    if (m.goal) {
      const bar = el("div", "bar");
      const a = el("i", "a"); a.style.width = Math.min(100, m.approved / m.goal * 100) + "%";
      const p = el("i", "p"); p.style.left = Math.min(100, m.approved / m.goal * 100) + "%";
      p.style.width = Math.min(100 - Math.min(100, m.approved / m.goal * 100), m.pending / m.goal * 100) + "%";
      const e = el("i", "e"); e.style.width = Math.min(100, m.expected / m.goal * 100) + "%";
      bar.append(a, p, e);
      const meta = el("div", "meta");
      const behind = m.approved + m.pending + 1e-9 < m.expected;
      meta.append(
        el("span", behind ? "warn" : "ok", behind ? "⚠️ Rejadan orqada" : "👍 Reja bo'yicha"),
        el("span", "", "Bugungacha kerak: " + fmt(m.expected)),
      );
      if (m.pending) meta.append(el("span", "", "⏳ Tekshirilmoqda: " + fmt(m.pending)));
      card.append(bar, meta);
    }
    app.append(card);
  });
}

load();
setInterval(load, 60000);
</script>
</body>
</html>
